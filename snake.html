<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .game-container {
            text-align: center;
            background: #16213e;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            color: #eee;
            font-size: 18px;
        }

        .score {
            background: #e94560;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
        }

        .best {
            color: #f0a500;
            font-weight: bold;
        }

        canvas {
            display: block;
            border: 2px solid #0f3460;
            border-radius: 4px;
            background: #0f3460;
        }

        .controls {
            margin-top: 16px;
            color: #aaa;
            font-size: 14px;
        }

        .game-over-overlay {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.8);
            pointer-events: none;
        }

        .btn {
            margin-top: 12px;
            padding: 10px 28px;
            font-size: 16px;
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #c73650;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <span>🐍 贪吃蛇</span>
            <span class="score">得分: <span id="score">0</span></span>
            <span class="best">🏆 最高: <span id="best">0</span></span>
        </div>
        <div style="position: relative; display: inline-block;">
            <canvas id="canvas" width="400" height="400"></canvas>
            <div class="game-over-overlay" id="gameOverOverlay">游戏结束</div>
        </div>
        <button class="btn" id="restartBtn">重新开始</button>
        <div class="controls">
            ↑ ↓ ← → 或 W A S D 控制方向 | 空格暂停
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const restartBtn = document.getElementById('restartBtn');

        // 游戏配置
        const GRID_SIZE = 20;
        const COLS = canvas.width / GRID_SIZE;   // 20
        const ROWS = canvas.height / GRID_SIZE;  // 20
        const BASE_SPEED = 120; // ms/帧

        // 游戏状态
        let snake = [];
        let food = {};
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let bestScore = 0;
        let gameLoop = null;
        let paused = false;
        let gameOver = false;
        let speed = BASE_SPEED;

        // 加载最高分
        bestScore = parseInt(localStorage.getItem('snakeBest') || '0');
        bestEl.textContent = bestScore;

        function initGame() {
            // 初始蛇：3 节，水平居中偏左
            const startX = Math.floor(COLS / 2);
            const startY = Math.floor(ROWS / 2);
            snake = [
                { x: startX, y: startY },
                { x: startX - 1, y: startY },
                { x: startX - 2, y: startY },
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            speed = BASE_SPEED;
            paused = false;
            gameOver = false;
            scoreEl.textContent = '0';
            gameOverOverlay.style.display = 'none';
            spawnFood();
            startLoop();
        }

        function spawnFood() {
            // 收集蛇占据的位置
            const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
            const free = [];
            for (let x = 0; x < COLS; x++) {
                for (let y = 0; y < ROWS; y++) {
                    if (!occupied.has(`${x},${y}`)) {
                        free.push({ x, y });
                    }
                }
            }
            if (free.length === 0) {
                // 赢了！
                gameOver = true;
                return;
            }
            food = free[Math.floor(Math.random() * free.length)];
        }

        function update() {
            if (paused || gameOver) return;

            // 更新方向
            direction = { ...nextDirection };

            // 新头部
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y,
            };

            // 穿墙 / 撞到自己
            const hitWall = head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS;
            const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);

            if (hitWall || hitSelf) {
                endGame();
                return;
            }

            snake.unshift(head);

            // 吃到食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                // 加速
                speed = Math.max(50, BASE_SPEED - score);
                spawnFood();
                if (gameOver) {
                    // 满了
                    endGame();
                    return;
                }
            } else {
                snake.pop();
            }

            restartLoop();
        }

        function draw() {
            // 清屏
            ctx.fillStyle = '#0f3460';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 画网格线
            ctx.strokeStyle = 'rgba(255,255,255,0.04)';
            ctx.lineWidth = 0.5;
            for (let x = 0; x <= COLS; x++) {
                ctx.beginPath();
                ctx.moveTo(x * GRID_SIZE, 0);
                ctx.lineTo(x * GRID_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= ROWS; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * GRID_SIZE);
                ctx.lineTo(canvas.width, y * GRID_SIZE);
                ctx.stroke();
            }

            // 画食物
            ctx.fillStyle = '#e94560';
            ctx.shadowColor = '#e94560';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(
                food.x * GRID_SIZE + GRID_SIZE / 2,
                food.y * GRID_SIZE + GRID_SIZE / 2,
                GRID_SIZE / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0;

            // 画蛇
            snake.forEach((seg, i) => {
                const alpha = 1 - i * 0.03;
                ctx.fillStyle = i === 0
                    ? '#00d2ff'  // 蛇头
                    : `rgba(0, 210, 255, ${Math.max(alpha, 0.3)})`;
                const padding = i === 0 ? 1 : 2;
                ctx.fillRect(
                    seg.x * GRID_SIZE + padding,
                    seg.y * GRID_SIZE + padding,
                    GRID_SIZE - padding * 2,
                    GRID_SIZE - padding * 2
                );

                // 蛇头眼睛
                if (i === 0) {
                    ctx.fillStyle = '#fff';
                    const cx = seg.x * GRID_SIZE + GRID_SIZE / 2;
                    const cy = seg.y * GRID_SIZE + GRID_SIZE / 2;
                    const eyeR = 3;
                    let ex1, ey1, ex2, ey2;
                    if (direction.x === 1) { // 右
                        ex1 = cx + 4; ey1 = cy - 3;
                        ex2 = cx + 4; ey2 = cy + 3;
                    } else if (direction.x === -1) { // 左
                        ex1 = cx - 4; ey1 = cy - 3;
                        ex2 = cx - 4; ey2 = cy + 3;
                    } else if (direction.y === -1) { // 上
                        ex1 = cx - 3; ey1 = cy - 4;
                        ex2 = cx + 3; ey2 = cy - 4;
                    } else { // 下
                        ex1 = cx - 3; ey1 = cy + 4;
                        ex2 = cx + 3; ey2 = cy + 4;
                    }
                    ctx.beginPath();
                    ctx.arc(ex1, ey1, eyeR, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(ex2, ey2, eyeR, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function gameStep() {
            update();
            draw();
        }

        function startLoop() {
            stopLoop();
            gameLoop = setInterval(gameStep, speed);
        }

        function restartLoop() {
            stopLoop();
            gameLoop = setInterval(gameStep, speed);
        }

        function stopLoop() {
            if (gameLoop) {
                clearInterval(gameLoop);
                gameLoop = null;
            }
        }

        function endGame() {
            gameOver = true;
            stopLoop();
            gameOverOverlay.style.display = 'block';
            // 更新最高分
            if (score > bestScore) {
                bestScore = score;
                bestEl.textContent = bestScore;
                localStorage.setItem('snakeBest', bestScore);
            }
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();

            if (key === ' ' || key === 'spacebar') {
                e.preventDefault();
                if (gameOver) return;
                paused = !paused;
                return;
            }

            if (paused || gameOver) return;

            switch (key) {
                case 'arrowup':
                case 'w':
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                    break;
                case 'arrowdown':
                case 's':
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    break;
                case 'arrowleft':
                case 'a':
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                    break;
                case 'arrowright':
                case 'd':
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    break;
            }
        });

        restartBtn.addEventListener('click', () => {
            stopLoop();
            initGame();
        });

        // 启动
        initGame();
    </script>
</body>
</html>
